ref: hyperv.job_poll
label: "Poll Hyper-V Operation State"
description: "Boundedly poll modeled VM or replication state; no process-local PowerShell job ID is implied"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  vm_id: {type: string, required: true}
  job_type: {type: string, required: true, enum: [vm_state, replication_state]}
  desired_state: {type: string, required: true, description: "Modeled state documented in README"}
  poll_timeout_seconds: {type: integer, minimum: 1, maximum: 600, default: 60}
  poll_interval_seconds: {type: integer, minimum: 1, maximum: 30, default: 5}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120, description: "Must exceed poll_timeout_seconds"}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, job, poll]
