ref: hyperv.switch_create
label: "Create Virtual Switch"
description: "Create a private, internal, or explicitly confirmed external virtual switch"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  expected_host: {type: string, required: true}
  name: {type: string, required: true}
  switch_type: {type: string, required: true, enum: [private, internal, external]}
  network_adapter_name: {type: string, description: "Exact physical adapter name; external switches only"}
  allow_management_os: {type: boolean, description: "Required explicit choice for external switches"}
  confirmation: {type: string, description: "External only: CREATE_EXTERNAL_SWITCH:<expected_host>:<name>"}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, switch, create]
