ref: hyperv.switch_delete
label: "Delete Virtual Switch"
description: "Delete a switch selected by stable GUID after exact host/switch confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  expected_host: {type: string, required: true}
  switch_id: {type: string, required: true}
  confirmation: {type: string, required: true, description: "DELETE_SWITCH:<expected_host>:<switch_id>"}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, switch, delete]
