ref: hyperv.vhd_resize
label: "Expand Virtual Hard Disk"
description: "Idempotently expand, but never shrink, a VHD at an absolute Hyper-V host path"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  expected_host: {type: string, required: true}
  vhd_host_path: {type: string, required: true}
  size_bytes: {type: integer, required: true, minimum: 1048576, maximum: 70368744177664}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, vhd, resize]
