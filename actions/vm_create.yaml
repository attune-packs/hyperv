ref: hyperv.vm_create
label: "Create Virtual Machine"
description: "Create a VHD-less VM on the explicitly confirmed Hyper-V host"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  expected_host: {type: string, required: true, description: "Must equal the profile host and actual Windows host"}
  name: {type: string, required: true}
  generation: {type: integer, enum: [1, 2], default: 2}
  memory_startup_bytes: {type: integer, minimum: 33554432, maximum: 17592186044416, default: 1073741824}
  switch_name: {type: string, description: "Exact existing switch name"}
  vm_host_path: {type: string, description: "Absolute path on the Hyper-V host, never a worker path"}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, vm, create]
