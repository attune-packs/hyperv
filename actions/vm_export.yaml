ref: hyperv.vm_export
label: "Export Virtual Machine"
description: "Synchronously export a stable VM ID to an absolute path on the Hyper-V host"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true}
  expected_host: {type: string, required: true}
  vm_id: {type: string, required: true}
  export_host_path: {type: string, required: true, description: "Absolute local destination on the Hyper-V host, not the Attune worker"}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 600}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, vm, export]
