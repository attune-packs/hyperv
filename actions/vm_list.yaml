ref: hyperv.vm_list
label: "List Virtual Machines"
description: "List VMs on the profiled Hyper-V host with stable IDs and selected status fields"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: hyperv_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: hyperv.credentials, required: true, description: "Pack-owned encrypted WinRM profile Key ref"}
  state: {type: string, enum: [Off, Running, Saved, Paused], description: "Exact optional VM state filter"}
  timeout_seconds: {type: integer, minimum: 5, maximum: 1800, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [hyperv, vm, read]
